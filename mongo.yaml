version: "3"
services:
  app:
    build: .
    ports:
      - 3000:3000
  mongodb:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$((MONGO_USERNAME))
      - MONGO_INITDB_ROOT_PASSWORD=$((MONGO_PASSWORD))
    volumes:
      - mongo-data:/data/db
  mongodb-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=$((MONGO_USERNAME))
      - ME_CONFIG_MONGODB_ADMINPASSWORD=$((MONGO_PASSWORD))
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb

volumes:
  mongo-data:
    driver: local
